[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-temporal-vae"
version = "0.1.0"
description = "Graph-enhanced Temporal-VAE architectures for time-series imputation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jui-Yang Lee" }
]
keywords = [
    "time-series",
    "imputation",
    "variational-autoencoder",
    "graph-neural-network",
    "uncertainty",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "pandas>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "scipy>=1.10",
    "matplotlib>=3.7",
    # Used by the evaluation/plotting scripts under examples/ and scripts/,
    # never by the library itself: importing graph_temporal_vae stays on the
    # core numpy/torch/pandas/tqdm set.
    "scikit-learn>=1.3",
]

[project.scripts]
graph-temporal-vae = "graph_temporal_vae.cli:main"

[tool.setuptools.packages.find]
include = ["graph_temporal_vae*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
