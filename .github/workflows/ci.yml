name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install package
        run: uv sync --locked --extra dev
      - name: Test
        run: uv run pytest -q
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: uv build
      - name: Verify wheel import
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/graph-temporal-vae-wheel
          /tmp/graph-temporal-vae-wheel/bin/pip install dist/*.whl
          /tmp/graph-temporal-vae-wheel/bin/python -c "from graph_temporal_vae import DataSchema, ImputationVAE_Graph, PreprocessingConfig"
